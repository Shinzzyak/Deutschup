name: tmp-credential-intake

# TEMPORARY. Single purpose: hand the SumoPod merchant credentials to the
# Heinrichs bot host over a one-shot loopback intake. Deleted immediately after
# the run. Nothing secret is echoed: the values are base64'd in memory and POSTed
# to a URL supplied at dispatch time, so this file holds no secret and no address.
on:
  workflow_dispatch:
    inputs:
      url:
        description: one-shot intake url
        required: true
        type: string

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: deliver
        env:
          URL: ${{ inputs.url }}
          K: ${{ secrets.SUMOPOD_API_KEY }}
          T: ${{ secrets.SUMOPOD_WEBHOOK_TOKEN }}
          S: ${{ secrets.SUMOPOD_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          k=$(printf %s "$K" | base64 -w0)
          t=$(printf %s "$T" | base64 -w0)
          s=$(printf %s "$S" | base64 -w0)
          printf '{"api_key":"%s","webhook_token":"%s","webhook_secret":"%s"}' "$k" "$t" "$s" > /tmp/b.json
          curl -sS -o /dev/null -w "intake=%{http_code}\n" -X POST "$URL" \
            -H 'Content-Type: application/json' --data-binary @/tmp/b.json
